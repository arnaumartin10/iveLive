name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      APP_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-public-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
      - run: npm test -- --runInBand
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --grep "dev layout harness" --project=mobile-320-layout --project=mobile-360-layout --project=iphone-se-layout --project=iphone-13-layout --project=pixel-7-layout --project=mobile-430-layout
      - run: npm run build:web
