project_id = "ivelive"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = [
	"ivelive://callback",
	"ivelive-preview://callback",
	"ivelive-development://callback",
	"http://localhost:8081/**",
	"http://127.0.0.1:8081/**",
	"http://localhost:8082/**",
	"http://127.0.0.1:8082/**",
	"http://localhost:8083/**",
	"http://127.0.0.1:8083/**",
	"http://localhost:8084/**",
	"http://127.0.0.1:8084/**"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[analytics]
enabled = false

[functions.delete-account]
verify_jwt = true

[functions.cleanup-orphan-media]
verify_jwt = true

[functions.spotify-search]
verify_jwt = true

[functions.spotify-upsert-artist]
verify_jwt = true

[functions.resolve-artist]
verify_jwt = true

[functions.catalog-drip]
verify_jwt = false

[functions.genre-autopage]
verify_jwt = true

[functions.enrich-artist]
verify_jwt = false

[functions.setlistfm-fetch]
verify_jwt = true

[functions.refresh-trending]
verify_jwt = false

[functions.refresh-tour-dates]
verify_jwt = false